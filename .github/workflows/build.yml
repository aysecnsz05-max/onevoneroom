name: Build Plugin
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -o OneVOneRoom.zip
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build with Maven
        run: mvn -B package --file OneVOneRoom/pom.xml
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: OneVOneRoom-jar
          path: OneVOneRoom/target/OneVOneRoom.jar
